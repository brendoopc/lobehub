name: Upstream Sync

permissions:
  contents: write
  issues: write
  actions: write

# Fork tem commits proprios: o sync anterior (a cada 6h, em "main") falhava sempre.
# Agora: duas vezes por mes (dias 1 e 16, ~a cada 15 dias), nas branches corretas.
# Se o merge colidir com os commits proprios, o job falha e avisa por e-mail.
on:
  schedule:
    - cron: '0 3 1,16 * *'
  workflow_dispatch:

jobs:
  sync_latest_from_upstream:
    name: Sync latest commits from upstream repo
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}

    steps:
      - uses: actions/checkout@v7

      - name: Sync upstream changes
        id: sync
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4
        with:
          upstream_sync_repo: lobehub/lobehub
          upstream_sync_branch: canary
          target_sync_branch: canary
          target_repo_token: ${{ secrets.GITHUB_TOKEN }} # automatico, nao precisa configurar
          test_mode: false

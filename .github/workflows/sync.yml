name: Upstream Sync

permissions:
  contents: write
  issues: write
  actions: write

# Agendamento removido de proposito: este fork tem commits proprios.
# O sync automatico a cada 6h colidia com eles e falhava sempre,
# gerando 4 notificacoes de falha por dia. Rode manualmente quando quiser.
on:
  workflow_dispatch:

jobs:
  sync_latest_from_upstream:
    name: Sync latest commits from upstream repo
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}

    steps:
      - uses: actions/checkout@v7

      - name: Sync upstream changes
        id: sync
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4
        with:
          upstream_sync_repo: lobehub/lobehub
          upstream_sync_branch: canary
          target_sync_branch: canary
          target_repo_token: ${{ secrets.GITHUB_TOKEN }} # automatico, nao precisa configurar
          test_mode: false

name: Limpeza Automática Neon

on:
  schedule:
    # Roda todo domingo às 03:00 (horário de Brasília = 06:00 UTC)
    - cron: '0 6 * * 0'
  workflow_dispatch: # Permite rodar manualmente clicando em um botão se quiser testar

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar cliente PostgreSQL
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Limpar mensagens e tópicos com mais de 90 dias (exceto favoritos)
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          psql "$DATABASE_URL" -c "
            DELETE FROM messages
            WHERE created_at < NOW() - INTERVAL '1500 days'
              AND (topic_id IS NULL OR topic_id NOT IN (SELECT id FROM topics WHERE favorite = true));

            DELETE FROM topics
            WHERE created_at < NOW() - INTERVAL '1500 days'
              AND favorite IS NOT TRUE;
          "
